method_name: "MATEval Full"
description: "Full MATEval with 10 API calls per problem (SR+COT+FB)"
api_calls_per_problem: 10
evaluation_dimensions:
  - "Mathematical Correctness"
  - "Logical Consistency"
  - "Clarity of Explanation"
  - "Completeness of Solution"
  - "Pedagogical Value"
features:
  - "Self-Reflection (SR)"
  - "Chain of Thought (COT)"
  - "Feedback (FB)"
agents:
  - name: "Mike"
    role: "First Mathematical Expert"
    capabilities: ["evaluation", "self_reflection"]
  - name: "John"
    role: "Second Mathematical Expert"
    capabilities: ["evaluation", "self_reflection"]
  - name: "Coordinator"
    role: "Feedback Provider and Discussion Facilitator"
  - name: "Consensus"
    role: "Final Decision Maker"
rounds: 2
reflection_enabled: true
feedback_enabled: true 